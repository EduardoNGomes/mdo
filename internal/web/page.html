<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:,">
  <title>{{.Title}} · mdo</title>
  <script>
    document.documentElement.dataset.theme = {{.Theme}} || (matchMedia('(prefers-color-scheme: light)').matches ? 'default-light' : 'default');
    document.documentElement.dataset.appearance = [{{range .Themes}}{{if .Light}}'{{.ID}}',{{end}}{{end}}].includes(document.documentElement.dataset.theme) ? 'light' : 'dark';
  </script>
  <style>{{.ComponentStyles}}</style>
  <style>{{.Styles}}</style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Back to top">
      <span class="brand-mark">M</span>
      <span>mdo</span>
    </a>
    <div class="document-info">
      <strong>{{.Title}}</strong>
      <span title="{{.Path}}">{{.Path}}</span>
    </div>
    <div class="header-actions">
      <div class="theme-control"><span aria-hidden="true">Theme</span>
        <wa-select class="theme-select" label="Theme for this page" size="small">
          {{range .Themes}}<wa-option value="{{.ID}}">{{.Name}}</wa-option>{{end}}
        </wa-select>
      </div>
      <wa-button class="pdf-button" variant="neutral" appearance="outlined" size="small" type="button" aria-label="Download PDF with navigation bookmarks" title="Preparing PDF" disabled>Preparing PDF</wa-button>
      <wa-button class="toc-button" variant="neutral" appearance="outlined" size="small" type="button" aria-expanded="false" aria-controls="toc">Contents</wa-button>
    </div>
  </header>

  <div class="layout" id="top">
    <aside class="toc-shell" id="toc" aria-label="Document contents">
      <p class="toc-label">In this document</p>
      <nav class="toc-nav"></nav>
    </aside>

    <main class="reader">
      <article class="markdown-body">{{.Content}}</article>
      <footer>Rendered locally by <span>mdo</span></footer>
    </main>
  </div>

  <wa-toast class="theme-toast" placement="bottom-end"></wa-toast>
  <script>{{.Components}}</script>
  {{if .Mermaid}}<script>{{.Mermaid}}</script>{{end}}
  <script>
    (() => {
      const token = {{.Token}};
      const layout = document.querySelector('.layout');
      const article = document.querySelector('.markdown-body');
      const toc = document.querySelector('.toc-nav');
      const tocShell = document.querySelector('.toc-shell');
      const tocButton = document.querySelector('.toc-button');
      const themeSelect = document.querySelector('.theme-select');
      const themeToast = document.querySelector('.theme-toast');
      let themeNotice;
      const pdfButton = document.querySelector('.pdf-button');
      const pdfName = {{.PDFName}};
      const renderingPDF = new URLSearchParams(location.search).has('pdf');
      let renderingMermaid = false;
      let documentReady = false;
      let pdfBlob;

      const lightThemes = new Set([{{range .Themes}}{{if .Light}}'{{.ID}}',{{end}}{{end}}]);
      themeSelect.value = document.documentElement.dataset.theme;

      async function setTheme(theme) {
        const root = document.documentElement;
        const direction = lightThemes.has(theme) ? 'to-light' : 'to-dark';
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        root.dataset.themeTransition = direction;

        const applyTheme = async () => {
          root.dataset.theme = theme;
          root.dataset.appearance = lightThemes.has(theme) ? 'light' : 'dark';
          themeSelect.value = theme;
          await rerenderMermaid();
        };

        if (!document.startViewTransition || reduceMotion) {
          try { await applyTheme(); }
          finally { delete root.dataset.themeTransition; }
          return;
        }

        const transition = document.startViewTransition(applyTheme);
        try { await transition.finished; }
        finally { delete root.dataset.themeTransition; }
      }

      themeSelect.addEventListener('change', async () => {
        if (renderingMermaid) {
          themeSelect.value = document.documentElement.dataset.theme;
          return;
        }
        const next = themeSelect.value;
        if (next === document.documentElement.dataset.theme) return;
        themeSelect.disabled = true;
        try {
          try { await setTheme(next); }
          catch (error) { console.error('mdo: could not rerender diagrams', error); }
          if (themeNotice?.isConnected) await themeNotice.hide();
          themeNotice = await themeToast.create(
            '<strong>Theme changed for this page only.</strong><br>To set your default theme, run <code>mdo --theme</code> in your terminal.',
            { allowHtml: true, variant: 'warning', duration: 10000 }
          );
        } finally { themeSelect.disabled = false; }
      });

      pdfButton.addEventListener('click', () => {
        if (!documentReady || !pdfBlob) return;
        const download = document.createElement('a');
        download.href = URL.createObjectURL(pdfBlob);
        download.download = pdfName;
        download.click();
        setTimeout(() => URL.revokeObjectURL(download.href), 0);
      });

      const slugCounts = new Map();
      const headings = article.querySelectorAll('h1, h2, h3');
      for (const heading of headings) {
        if (!heading.id) {
          const base = heading.textContent.toLowerCase().normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'secao';
          const count = slugCounts.get(base) || 0;
          slugCounts.set(base, count + 1);
          heading.id = count ? `${base}-${count + 1}` : base;
        }
        const anchor = document.createElement('a');
        anchor.className = 'heading-anchor';
        anchor.href = `#${heading.id}`;
        anchor.setAttribute('aria-label', `Link to ${heading.textContent}`);
        anchor.textContent = '#';
        heading.prepend(anchor);

        const link = document.createElement('a');
        link.href = `#${heading.id}`;
        link.className = `toc-h${heading.tagName.slice(1)}`;
        link.textContent = heading.textContent.replace(/^#/, '').trim();
        link.addEventListener('click', () => {
          tocShell.classList.remove('open');
          tocButton.setAttribute('aria-expanded', 'false');
        });
        toc.append(link);
      }
      if (!headings.length) {
        tocShell.hidden = true;
        tocButton.hidden = true;
        layout.classList.add('no-toc');
      }

      tocButton.addEventListener('click', () => {
        const open = tocShell.classList.toggle('open');
        tocButton.setAttribute('aria-expanded', String(open));
      });

      for (const link of article.querySelectorAll('a[href]')) {
        const href = link.getAttribute('href') || '';
        if (/^https?:\/\//i.test(href)) {
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        }
      }

      for (const link of document.querySelectorAll('a[href^="#"]')) {
        link.addEventListener('click', (event) => {
          const hash = link.getAttribute('href');
          if (!hash || hash === '#') return;

          let target;
          try { target = document.getElementById(decodeURIComponent(hash.slice(1))); }
          catch { return; }
          if (!target) return;

          event.preventDefault();
          const behavior = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
          if (target === layout) layout.scrollTo({ top: 0, behavior });
          else target.scrollIntoView({ behavior, block: 'start' });
          history.pushState(null, '', hash);
        });
      }

      for (const code of article.querySelectorAll('pre code')) {
        if (code.classList.contains('language-mermaid')) continue;
        const pre = code.closest('pre');
        if (!pre || pre.parentElement?.classList.contains('code-shell')) continue;
        const shell = document.createElement('div');
        shell.className = 'code-shell';
        pre.replaceWith(shell);
        shell.append(pre);
        const button = document.createElement('wa-button');
        button.size = 'small';
        button.variant = 'neutral';
        button.appearance = 'outlined';
        button.type = 'button';
        button.className = 'copy-button';
        button.textContent = 'Copy';
        button.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(code.textContent);
            button.textContent = 'Copied';
            setTimeout(() => { button.textContent = 'Copy'; }, 1400);
          } catch { button.textContent = 'Failed'; }
        });
        shell.append(button);
      }

      function enableDiagramZoom(container) {
        const svg = container.querySelector('svg');
        if (!svg || !svg.viewBox?.baseVal) return;

        const initial = svg.viewBox.baseVal;
        const original = { x: initial.x, y: initial.y, width: initial.width, height: initial.height };
        let view = { ...original };
        let dragging = null;

        const shell = document.createElement('section');
        shell.className = 'diagram-shell';
        shell.setAttribute('aria-label', 'Interactive Mermaid diagram');
        const toolbar = document.createElement('div');
        toolbar.className = 'diagram-toolbar';
        const navigation = document.createElement('div');
        navigation.className = 'diagram-navigation';
        navigation.setAttribute('aria-label', 'Diagram navigation');
        const actions = document.createElement('div');
        actions.className = 'diagram-actions';
        const viewport = document.createElement('div');
        viewport.className = 'diagram-viewport';

        container.replaceWith(shell);
        toolbar.append(navigation, actions);
        shell.append(toolbar, viewport);
        viewport.append(container);

        const button = (parent, label, title, action, className = '') => {
          const control = document.createElement('wa-button');
          control.size = 'small';
          control.variant = 'neutral';
          control.appearance = 'outlined';
          control.type = 'button';
          control.className = `diagram-control ${className}`.trim();
          control.textContent = label;
          control.title = title;
          control.setAttribute('aria-label', title);
          control.addEventListener('click', action);
          parent.append(control);
          return control;
        };

        const zoomLabel = button(actions, '100%', 'Reset zoom', () => reset(), 'zoom-label');

        function scale() {
          return original.width / view.width;
        }

        function apply() {
          svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.width} ${view.height}`);
          zoomLabel.textContent = `${Math.round(scale() * 100)}%`;
        }

        function zoom(factor, clientX, clientY) {
          const currentScale = scale();
          const nextScale = Math.min(4, Math.max(.5, currentScale * factor));
          const nextWidth = original.width / nextScale;
          const nextHeight = original.height / nextScale;
          const bounds = svg.getBoundingClientRect();
          const anchorX = Number.isFinite(clientX) && bounds.width ? (clientX - bounds.left) / bounds.width : .5;
          const anchorY = Number.isFinite(clientY) && bounds.height ? (clientY - bounds.top) / bounds.height : .5;
          view.x += (view.width - nextWidth) * Math.min(1, Math.max(0, anchorX));
          view.y += (view.height - nextHeight) * Math.min(1, Math.max(0, anchorY));
          view.width = nextWidth;
          view.height = nextHeight;
          apply();
        }

        function reset() {
          view = { ...original };
          apply();
        }

        function pan(horizontal, vertical) {
          view.x += view.width * horizontal;
          view.y += view.height * vertical;
          apply();
        }

        button(navigation, '←', 'Pan diagram left', () => pan(-.12, 0));
        button(navigation, '↑', 'Pan diagram up', () => pan(0, -.12));
        button(navigation, '↓', 'Pan diagram down', () => pan(0, .12));
        button(navigation, '→', 'Pan diagram right', () => pan(.12, 0));

        button(actions, '−', 'Zoom out', () => zoom(1 / 1.25));
        actions.append(zoomLabel);
        button(actions, '+', 'Zoom in', () => zoom(1.25));
        button(actions, '⛶', 'Open fullscreen', async () => {
          if (document.fullscreenElement === shell) {
            await document.exitFullscreen();
          } else if (shell.requestFullscreen) {
            await shell.requestFullscreen();
          }
        }, 'fullscreen-control');

        viewport.addEventListener('wheel', event => {
          if (!event.ctrlKey) return;
          event.preventDefault();
          zoom(event.deltaY < 0 ? 1.15 : 1 / 1.15, event.clientX, event.clientY);
        }, { passive: false });

        viewport.addEventListener('pointerdown', event => {
          if (event.button !== 0) return;
          dragging = { x: event.clientX, y: event.clientY, viewX: view.x, viewY: view.y };
          viewport.classList.add('is-panning');
          viewport.setPointerCapture(event.pointerId);
        });
        viewport.addEventListener('pointermove', event => {
          if (!dragging) return;
          const bounds = svg.getBoundingClientRect();
          view.x = dragging.viewX - (event.clientX - dragging.x) * view.width / bounds.width;
          view.y = dragging.viewY - (event.clientY - dragging.y) * view.height / bounds.height;
          apply();
        });
        const stopDragging = event => {
          if (!dragging) return;
          dragging = null;
          viewport.classList.remove('is-panning');
          if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
        };
        viewport.addEventListener('pointerup', stopDragging);
        viewport.addEventListener('pointercancel', stopDragging);

        viewport.classList.add('can-pan');
        apply();
      }

      function mermaidSourceWithFallback(source) {
        if (!/^\s*sequenceDiagram\b/.test(source)) return source;
        return source.replace(/;(?=<br\s*\/?>)/gi, '#59;');
      }

      async function prepare() {
        for (const code of article.querySelectorAll('code.language-mermaid')) {
          const container = code.closest('.highlight') || code.closest('pre');
          const diagram = document.createElement('pre');
          diagram.className = 'mermaid';
          diagram.dataset.mermaidSource = mermaidSourceWithFallback(code.textContent);
          diagram.textContent = diagram.dataset.mermaidSource;
          container.replaceWith(diagram);
        }

        await renderMermaid();
      }

      async function renderMermaid() {
        const diagrams = [...article.querySelectorAll('.mermaid')];
        if (!diagrams.length || renderingMermaid) return;
        renderingMermaid = true;
        const palette = getComputedStyle(document.documentElement);
        const printPalette = {
          '--bg': '#ffffff', '--surface-strong': '#f1f5f9', '--ink': '#111827',
          '--muted': '#475569', '--accent': '#075985', '--mermaid-primary': '#f8fafc'
        };
        const color = name => renderingPDF ? printPalette[name] : palette.getPropertyValue(name).trim();
        try {
          mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'strict',
            theme: 'base',
            fontFamily: 'Inter, ui-sans-serif, system-ui, sans-serif',
            themeVariables: {
              primaryColor: color('--mermaid-primary'), primaryTextColor: color('--ink'),
              primaryBorderColor: color('--accent'), lineColor: color('--muted'),
              secondaryColor: color('--surface-strong'), tertiaryColor: color('--bg'),
              background: color('--bg'), mainBkg: color('--mermaid-primary'),
              textColor: color('--ink'), nodeBorder: color('--accent')
            }
          });
          await mermaid.run({ nodes: diagrams, suppressErrors: false });
          for (const diagram of diagrams) enableDiagramZoom(diagram);
        } finally {
          renderingMermaid = false;
        }
      }

      async function rerenderMermaid() {
        const shells = [...article.querySelectorAll('.diagram-shell')];
        for (const shell of shells) {
          const current = shell.querySelector('.mermaid');
          if (!current) continue;
          const diagram = document.createElement('pre');
          diagram.className = 'mermaid';
          diagram.dataset.mermaidSource = current.dataset.mermaidSource;
          diagram.textContent = diagram.dataset.mermaidSource;
          shell.replaceWith(diagram);
        }
        await renderMermaid();
      }

      window.addEventListener('load', async () => {
        try {
          await prepare();
          if (renderingPDF) return;

          const response = await fetch(`/${token}/pdf`, {
            headers: { 'X-MDO-Token': token },
          });
          if (!response.ok) throw new Error(`PDF: ${response.status}`);
          pdfBlob = await response.blob();
          documentReady = true;
          pdfButton.textContent = 'Download PDF';
          pdfButton.title = 'Download PDF with navigation bookmarks';
          pdfButton.disabled = false;
        }
        catch (error) {
          console.error('mdo: could not prepare PDF', error);
          pdfButton.textContent = 'PDF unavailable';
          pdfButton.title = 'Could not generate PDF';
        } finally {
          window.mdoReady = true;
          if (renderingPDF) return;
          fetch(`/${token}/ready`, {
            method: 'POST',
            headers: { 'X-MDO-Token': token },
            keepalive: true
          }).catch(() => {});
        }
      });
    })();
  </script>
</body>
</html>
