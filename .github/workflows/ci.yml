name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-windows-installer:
    name: Windows installer (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test installation and PATH registration in Windows PowerShell
        if: matrix.shell == 'powershell'
        shell: powershell
        run: .\tests\install-windows.Tests.ps1

      - name: Test installation and PATH registration in PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: .\tests\install-windows.Tests.ps1

  test:
    name: Test
    uses: EduardoNGomes/shared-workflows/.github/workflows/go-test-simple.yml@main

  verify-build:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build application
        run: go build -trimpath -ldflags="-s -w" -o /tmp/mdo ./cmd
