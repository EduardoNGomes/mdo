name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-windows-installer:
    name: Windows installer (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test installation and PATH registration in Windows PowerShell
        if: matrix.shell == 'powershell'
        shell: powershell
        run: .\tests\install-windows.Tests.ps1

      - name: Test installation and PATH registration in PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: .\tests\install-windows.Tests.ps1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Verify build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/mdo ./cmd
